notes: >
  Project Registry is the ONLY canonical source of project phase (F-6).
  Team Checkpoint phases are derived presentation only. Context repo topology:
  single Git repo with team/project dual logical roots (F-2); scope isolation
  is enforced by Canonical Scope + Policy + Retrieval Engine, not repo count.
  Project ids are stable short ids; multica_project_id keeps the Multica
  workspace identity for traceability. Role lists use the current six-role
  model. Review roles stay on-demand by design (R0/R1/R2 review level and
  milestone-triggered QA). Role migration evidence remains in git history.
  YZT-98 (Human decision recorded on YZT-97, bootstrap exception approved
  2026-09-16): TeachersApp1 is a NEW independent project under Multica project
  7a2195b5-6628-4b02-9fb2-bc3ce161de85. The former `app1` entry is retained
  for traceability but moved to phase `archived`: its Multica project UUID,
  repository location and canonical subtree no longer identify the active
  project, so a handoff PLAN scoped to `app1` fails closed (ScopeError
  "archived project 'app1' excluded") and a package scoped to it fails
  SELF_CHECK with `scope_mismatch`. No identity, frozen conclusion, VOC or
  completion state is inherited by `teachers-app1`. Retirement record and
  rollback: migration/retirement/app1-retirement-yzt98.md.

