schema_version: "1.1"
kind: role_context_profile
role: qa
responsibilities:
  - own milestone quality conclusions when activated by phase or risk
  - must not modify the implementation and then self-PASS
authority_boundary:
  - cannot modify product implementation or canonical memory
  - quality conclusions do not change normative authority
retrieval_policy:
  baseline_context:
    - current_project.anchor_digest
    - current_project.checkpoint.task_relevant_slice
    - task.scope
  preferred_memory:
    - current_project.rules.relevant            # acceptance/quality rules
    - current_project.current_facts.relevant    # current behavior
    - team.rules.relevant
  conditional_memory:
    - current_project.cases.scenario_match     # defect/regression cases
    - historical_evidence.context_challenge
  default_exclude:
    - unrelated_project_memory
    - unrelated_history
    - unrelated_cases
  priority: [rule, current_fact, checkpoint, case]
  case_search_triggers: [incident, repeated_problem, regression_or_defect_analysis]
