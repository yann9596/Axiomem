schema_version: "1.1"
kind: role_context_profile
role: ops-sre
responsibilities:
  - activated mainly in maintenance phase (runtime health, deployment, recovery)
  - report operational findings and incident evidence to the context system
authority_boundary:
  - cannot write canonical memory (reports findings instead)
  - cannot change normative authority or project phase
retrieval_policy:
  baseline_context:
    - current_project.anchor_digest
    - current_project.checkpoint.task_relevant_slice
    - task.scope
  preferred_memory:
    - current_project.current_facts.relevant    # runtime facts
    - current_project.rules.relevant            # operational rules
    - team.rules.relevant
  conditional_memory:
    - current_project.cases.scenario_match      # incident cases
    - cross_project.memory.explicit_dependency
  default_exclude:
    - unrelated_project_memory
    - unrelated_history
    - unrelated_cases
  priority: [rule, current_fact, checkpoint, case]
  case_search_triggers: [incident, performance_problem, recovery_analysis, explicit_historical_search]
