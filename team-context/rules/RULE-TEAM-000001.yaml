schema_version: "1.1"
kind: rule
id: RULE-TEAM-000001
legacy_ids:
  - governance-owner-boundaries

title: Team owner boundaries (V2.2 six-role model)
statement: >
  Engineering Lead owns project scope, priority, task decomposition and
  routing, sets review levels (R0/R1/R2), and is the only formal QA-gate
  trigger. Context Engineer is the sole normal write owner for Canonical
  Memory (project, team, task context and RAG derived layer) and governs the
  Product Expectation Baseline as a versioned project artifact without owning
  the product direction decision. Solution Architect owns technical design and
  the Design Baseline; Software Engineer owns product implementation;
  Delivery Reviewer owns deliverable correctness and integrity review; QA owns
  Product Expectation + Design Conformance + milestone quality conclusions.
  Any role may challenge, but
  unresolved cross-role disagreement escalates to Engineering Lead after one
  round trip. Any role may Challenge; no role silently takes over another
  Owner's domain. Human decisions presented by any role or project follow the
  single common Human decision contract carried by the bound shared skill
  (background/current state, concrete options, effects, recommendation, exact
  approval boundary, behaviour while undecided), not a per-role or per-product
  approval format. Approved durable decisions, contracts, role boundaries and
  materially stale state are curated through the shared Memory governance
  routing: Engineering Lead records a concrete Memory Disposition and, when
  needed, one deduplicated bounded task for this owner; ordinary Finding
  capture is not an automatic trigger. Reference the versioned skill text
  instead of restating either contract here.

scope:
  type: team
  project_id: null
  projects: []
  task_id: null

modality: MUST

domains:
  - governance
  - ownership

applicability:
  deterministic:
    project_phases: [incubation, active_development, maintenance, deprecated]
    repos: []
    task_types: []
  semantic:
    applicable_when:
      - any task involving role ownership, canonical memory writes or cross-role handoff
      - any task presenting a Human decision, recording a Memory Disposition or curating approved durable changes
    not_applicable_when:
      - platform-managed runtime maintenance not touching team cognition

relevant_roles:
  - engineering-lead
  - context-engineer
  - solution-architect
  - software-engineer
  - delivery-reviewer
  - qa

exception_policy: explicit

