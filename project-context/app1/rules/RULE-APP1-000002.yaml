schema_version: "1.1"
kind: rule
id: RULE-APP1-000002
legacy_ids: []

title: Evidence is the fact asset; derived state must be recomputable
statement: >
  Evidence 是核心资产：原始事实长期保留，教师可纠正，不被下游 AI 输出反向覆盖。
  State/FollowUp/AttentionThread 是可重算的派生结果：可清空后从 Evidence 全量
  重算；改 Policy/阈值/模型不需教师重录。上游 Evidence 改动 → 相关
  Thread/State/FollowUp 必须重算。没有新 Evidence 不能自动认定改善。

