id: RULE-APP1-000003
legacy_ids: []

title: HarmonyOS tech baseline and layering hard constraints (T02A)
statement: >
  ArkTS + ArkUI 声明式 + Stage Model 固定；业务主数据用 ArkData relationalStore
  （不用已停止维护的 @ohos.data.rdb；不用 JSON/KV 再迁移）；Preferences 仅 UI
  偏好/默认 Scene 等轻配置，不得承载 Evidence/Thread/State 主数据。分层硬约束：
  StateEngine 不写在 ArkUI 页面事件、FollowUpEngine 不依赖 Notification Kit、
  TopicPolicy 不绑页面组件、Validation 可纯 Domain 单元测试、Scene Pack 尽可能
  配置化。HarmonyOS 原生优先（P14）；核心领域层与平台能力解耦（P15）。

