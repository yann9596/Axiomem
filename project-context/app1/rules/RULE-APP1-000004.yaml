schema_version: "1.1"
kind: rule
id: RULE-APP1-000004
legacy_ids: []

title: LLM as replaceable enhancement behind an Adapter
statement: >
  LLM 是可替换增强层（P11）：关闭后主闭环仍成立。Domain 禁止直连模型 SDK；
  模型文本不得作为 State 事实来源；不得因模型不可用断掉主链。LLM 能力
  （structureObservation / normalizeEvidence / generateParentMessage）一律经
  Adapter 接入。AI 解决语义，不决定学情成立（P12）。

scope:
  type: project
  project_id: app1
  projects: []
  task_id: null

modality: MUST

domains:
  - ai-integration
  - architecture

applicability:
  deterministic:
    project_phases: [incubation, active_development, maintenance]
    repos: [teachers-app1]
    task_types: []
  semantic:
    applicable_when:
      - any LLM integration, adapter design, or AI-output consumption decision
    not_applicable_when:
      - no-LLM structural work

relevant_roles:
  - solution-architect
  - software-engineer
  - delivery-reviewer

exception_policy: none

