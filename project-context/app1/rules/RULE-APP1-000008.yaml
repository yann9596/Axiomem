kind: rule
id: RULE-APP1-000008
legacy_ids: []

title: TEST_ONLY policies and rules are never product defaults
statement: >
  synthetic_only_fail_closed 交付中的 TEST_ONLY 状态策略（TEST_ONLY_STATE_POLICY_V1）、
  TEST_ONLY follow-up 规则（TEST_ONLY_FOLLOWUP_RULE_V1）及其 params/scene 不得
  作为产品默认；真实 needed-evidence 规则与教师话术仍待教师反馈。execution
  mode 固定为 synthetic_only_fail_closed 且 real_data_mode=disabled 直到被显式
  决策替代。

