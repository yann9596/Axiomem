schema_version: "1.1"
kind: rule
id: RULE-APP1-000007
legacy_ids: []

title: Data security minimum requirements
statement: >
  Evidence 默认仅本机；日志不得输出学生姓名、Evidence 正文、家长沟通正文；
  模型请求经数据最小化层；数据库预留加密与迁移；密钥优先 HUKS、不得硬编码；
  删除学生/班级必须定义关联数据清除策略；备份导出非首发硬要求但 Schema 预留。

