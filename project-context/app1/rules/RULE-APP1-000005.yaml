domains:
  - follow-up
  - notifications
  - ux-constraints

applicability:
  deterministic:
    project_phases: [incubation, active_development, maintenance]
    repos: [teachers-app1]
    task_types: []
  semantic:
    applicable_when:
      - designing follow-up presentation, recall, notification, or home-page information architecture
    not_applicable_when:
      - manual (user-initiated) recall flows without push semantics

