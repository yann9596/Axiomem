schema_version: "1.1"
kind: rule
id: RULE-APP1-000005
legacy_ids: []

title: Follow-up stays silent-by-default and decoupled from system notifications
statement: >
  Follow-up 与系统通知完全解耦（方案 §4.4）：Engine → Record → Recall
  Strategy（Scene 内静默 / 学生页 / Thread 页默认；首页"近期关注"静默区待
  UX 验证）。系统通知仅经 Adapter 且教师明确 opt-in。Round 2 VOC 收紧：
  禁止默认推送、禁止"今天待跟进"作为首页第一信息；实验仅限个人 opt-in、
  批次/静默、嵌入手动复盘仪式。任何把默认推送/催办美学引入 Follow-up 呈现的
  设计违反基线。

scope:
  type: project
  project_id: app1
  projects: []
  task_id: null

