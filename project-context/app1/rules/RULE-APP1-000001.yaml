schema_version: "1.1"
kind: rule
id: RULE-APP1-000001
legacy_ids: []

title: Local-first data residency
statement: >
  学生数据默认仅保存在设备本地；核心闭环不依赖登录/云同步/模型 API；外部能力
  只发送最小必需数据。本地优先是产品与技术共同约束（P16）。

