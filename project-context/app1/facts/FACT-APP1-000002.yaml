title: Six core domain objects and Evidence minimum fields (frozen naming, unfrozen relations)
statement: >
  基线命名六个核心领域对象：Student；Evidence；AttentionThread；State；FollowUp；
  Action（名称来自冻结基线，精确关系属 T02，尚未冻结）。Evidence 最少字段
  （方案 §3.1B）：student_id、scene、topic、direction、timestamp、task?（可选）、
  note?（可选）、source（manual/AI_structured）、created_at。AttentionThread 按
  student+normalized_topic 自动组织历史 Evidence，维度 Student×Topic×Time；Thread
  不等于人格画像。State 由 Evidence+Topic Policy 派生；FollowUp 每个未充分确认的
  Thread 维护"下一步最好获得什么证据"；Action MVP 首要为继续教学观察、家长沟通。

