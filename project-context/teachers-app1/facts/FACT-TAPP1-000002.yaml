  工作的前置。工具接入、真实交接 canary 与旧有界修复已完成其已验范围；本机能力
  策略仍默认拒绝，知识/工程/方法三包按角色启用，device 包 OFF。构建、CodeLinter
  与本地测试有各自证据：本地单测 43/43 与 scoped 2/2 PASS、宿主 SQLite 合成探针
  65/65 PASS、仓库检查按当轮证据；真机、HarmonyOS relationalStore、UI 走查、
  签名、发布与 R2 仍为 NOT_RUN，不得由宿主探针或合成组件冒充平台持久化 PASS。
  产品路径 D:\AI\projects\TeachersApp1，execution_mode=worktree；平台默认工作树
  develop=9afcf154，任务工作树按 Issue 精确 commit 建立。本条取代
  FACT-TAPP1-000001 的旧 as-of 状态（旧 main=3678608/"落后 2 提交"/"工作树干净"、
  旧 origin/main=0ad4bd9 快照）：历史出处与当时证据保留在该被取代对象与 git 历史中，
  不改写为从未发生。

