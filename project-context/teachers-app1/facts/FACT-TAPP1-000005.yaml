  chat 类 URI 形式，故两个 chat 消息以消息 ID 明确列在本条 verified_against 的 paths 中；
  下列每一项批准语义均可追到该附件与父 116 决定。批准内容按项如下，未列出的部分一律
  未批准：
  G01（2A；候选先限于语文学科作业完成情况，「未完成」与「完成情况改善」归入同一学习
  主题）：按独立观察记录计数，教师无需额外选择作业，同一作业的多次独立观察也计数，不
  要求新增作业身份；在当前关注阶段内，末尾连续负向记录达到 1/2/3 次分别建议「待再看／
  重复出现／持续关注」；连续正向 1～2 次为「改善中」、3 次为「已缓解」；方向变化重新计
  连续段；没有记录不自动变状态；教师判断不受这些次数限制。
  G02（3A）：仅教师确认结束关注阶段；系统「已缓解」只是建议，教师明确选择已缓解或停止
  关注才关闭；历史时间归属不清的补记保留输入并等待明确核对；两种方案都保留正向观察；
  阶段关闭后出现新观察可建立新阶段，不改写旧阶段；不得引入有限自动关闭方案。
  G06（4A）：名单初始按添加顺序排列，新学生放末尾；改名或新增学情不改变位置。
  仍未批准（保持 pending，不得由本次批准推定）：G01 的「按不同作业计数」备选与「暂缓」、
  G02 的有限自动关闭与「暂缓」、G06 的拖动排序、同班同名区分方式与旧名单迁移；本批准
  只覆盖上面写明的产品语义，不是对原候选设计整体的批准，也不是对 1A 之外任何部署、公开
  上传、main 合并、真实数据、旧库迁移执行、设备、签名或发布的授权。
  Reality（尚未实现、未验证；本批为有界只读源码检索 @ 产品仓 a67179d，未重跑构建或设备）：
  没有作业完成情况的生产判断规则，也没有任何按观察次数推进建议或阶段的代码；S1 采集合同
  在缺少已批准输入时仍然 fail-closed——entry/src/main/ets/data/CaptureIntent.ets:87
