statement: >
  as-of 2026-09-18（YZT-142 治理核验；用户决定时点为 UTC 2026-09-17T23:51:17Z）。
  Norm（本次批准，只记录语义指针，不复制原候选设计，也不把候选整体升级为批准）：
  用户在 direct room 明确选择 1A/2A/3A/4A。来源为 chat 消息
  01a0b1c8-1dd8-7786-a545-8f08f791b031（2026-09-17T23:51:17.203788Z，正文
  「1 A 2 A 3 A 4 A」）与给出完整选项的 chat 消息
  01a0b1c4-9c18-782a-b1ed-4f31de3d68c8（2026-09-17T23:47:27.380758Z）；01 已把这两条
  消息原文留存为 multica://issue/YZT-142 的附件 approval-source.json（附件
  01a0b1ce-3c8f-7712-9433-4310734628e7，SHA256
  9b664b513775997cb4b7025b9454109394d8ab15aded7310577b82a4ac7d6856，本批实读并核验）。
  治理调度来自父 multica://issue/YZT-116 的 Memory Disposition（governance scheduled、
  Owner 02，记于 YZT-142 描述所载 01 Execution Decision，并由 116 中已发布的 YZT-142
  包 multica://comment/01a0b1e7-beb6-7d49-939b-90e0da62449e 承接）。Canonical 没有
  chat 类 URI 形式，故两个 chat 消息以消息 ID 明确列在本条 verified_against 的 paths 中；
  下列每一项批准语义均可追到该附件与父 116 决定。批准内容按项如下，未列出的部分一律
  未批准：
  G01（2A；候选先限于语文学科作业完成情况，「未完成」与「完成情况改善」归入同一学习
  主题）：按独立观察记录计数，教师无需额外选择作业，同一作业的多次独立观察也计数，不
  要求新增作业身份；在当前关注阶段内，末尾连续负向记录达到 1/2/3 次分别建议「待再看／
  重复出现／持续关注」；连续正向 1～2 次为「改善中」、3 次为「已缓解」；方向变化重新计
  连续段；没有记录不自动变状态；教师判断不受这些次数限制。
  G02（3A）：仅教师确认结束关注阶段；系统「已缓解」只是建议，教师明确选择已缓解或停止
  关注才关闭；历史时间归属不清的补记保留输入并等待明确核对；两种方案都保留正向观察；
  阶段关闭后出现新观察可建立新阶段，不改写旧阶段；不得引入有限自动关闭方案。
  G06（4A）：名单初始按添加顺序排列，新学生放末尾；改名或新增学情不改变位置。
  仍未批准（保持 pending，不得由本次批准推定）：G01 的「按不同作业计数」备选与「暂缓」、
  G02 的有限自动关闭与「暂缓」、G06 的拖动排序、同班同名区分方式与旧名单迁移；本批准
  只覆盖上面写明的产品语义，不是对原候选设计整体的批准，也不是对 1A 之外任何部署、公开
  上传、main 合并、真实数据、旧库迁移执行、设备、签名或发布的授权。
  Reality（尚未实现、未验证；本批为有界只读源码检索 @ 产品仓 a67179d，未重跑构建或设备）：
  没有作业完成情况的生产判断规则，也没有任何按观察次数推进建议或阶段的代码；S1 采集合同
  在缺少已批准输入时仍然 fail-closed——entry/src/main/ets/data/CaptureIntent.ets:87
  POLICY_NOT_CONFIGURED（注释原文 "No approved TopicPolicy input. Rejected before the
  transaction."）与 :89 LIFECYCLE_NOT_CONFIGURED（"No approved lifecycle input..."），
  即本次批准的语义尚未成为「已配置策略」，相应输入仍被拒绝，必须由 03/04 在对应切片形成
  已审设计/实现合同后才可能被消费。名单侧也没有教师可见顺序：产品源码中无
  Reorder/orderRevision/student_order，M1 只有四类创建/更名命令与三类点读
  （entry/src/main/ets/data/RosterContract.ets:21–24 的 CreateClass/1、CreateStudent/1、
  RenameClass/1、RenameStudent/1），无 order 表、无列表或排序 API、无名单 UI。
  HarmonyOS relationalStore、真机、UI 走查、签名、发布与 R2 仍为 NOT_RUN。批准语义不等于
  已实现，也不代表任何平台、设备或产品完成结论。
  与既有对象的关系：本条不取代 FACT-TAPP1-000003 或 FACT-TAPP1-000004，也不改写任何历史
  正文；它承接这两条 pending 措辞中「G01/G02 与 G06 未批准」的部分（本批对 003、004 只加
  最小更新指针），并使 checkpoint 的未冻结语义范围收窄为本条所列的剩余项。
  产品仓权威文档更新需求（不属本批；02 不改产品代码、不替 03 写设计）：产品仓
  docs/product/product-expectations.md 的「尚未冻结的产品语义」段、
  docs/project-management/mvp-execution-plan.md 关于 G01/G02 的待决表述，以及 D02 设计
  design_baseline / teachers-app1-d02-roster-design / 0.1.0-draft 的 §Open Questions
  中 G06 候选状态（候选 A 当时只是建议、不是批准来源，且明确不含拖动 UI）都落后于本次
  批准，须由 04 在对应切片形成已审更新后交 01 决定版本。
  YZT-158 更新（2026-09-18 +08:00 / UTC 治理批次，只新增「落实本批准语义的设计已审并被
  01 接受」这一持久指针与其停止边界，不改写上文任何历史叙述，也不把候选设计整体升级为
  已批准规范）：design_baseline / teachers-app1-s2-approved-rules-design / 0.1.0-draft
  （03 Solution Architect，YZT-156 最终评论 01a0b42e-c1f6-7a4b-b2e5-31b746a35503；正文
  SHA256 86d9f3c8d221dac27f1283bb3cb09d54df47b73a72a2b6657c94ecc1ff7f1957，信封 SHA256
  de55da28ee0df6dc546e18b16dded5ad9f304fac3e03c907139905b071c7b540）经 05 独立 R1
  （YZT-157 最终评论 01a0b43a-7c8d-7866-b862-52f96ef96fba；报告 SHA256
  0de81efc378d60dd4f4b6ad633f8dec41f2b21634fc2c4e3bc66df450205455a，审查信封 SHA256
  4495dfb60268843ba34e5f12b827c2e7ff706ccedce91c3c44339c248834cb10；审查产物标识
  delivery_review / teachers-app1-s2-approved-rules-design-r1-review / 0.1.0）verdict
  APPROVE、scope_verdict APPROVE_AS_CANDIDATE_DESIGN_FOR_C1_AND_R1_SLICES、Required
  Changes NONE、Challenges NONE；01 Engineering Lead 在 multica://issue/YZT-158 的 Decision
  接受该候选设计为两项技术基线：C1 纯观察计数器，以及可独立交付的合成名单追加切片。接受
  范围只有这两项切片，候选的其余部分（尤其 L1 持久化 DDL 与生产组装/UI）不因本接受成为
  已批准规范，本条上文的 G01/G02/G06 Norm 也不因本接受扩大或改写。
  切片边界（本条只记指针，不复制设计正文）：C1 是纯观察计数器（用例 C01–C13；纯内存算法，
  无 schema 变更、不写库、不依赖墙钟/UI/平台库），把 N1/N2 落实为可验证计算；名单追加切片
  在本设计内限定为全新合成库 d02-roster-append/1（user_version=3 / schema_version=3，基于
  v2 结构新增 roster_order_state 与 student_order 两表）落实 N5，禁止改动生产
  EntryAbility、禁止旧库自动迁移、不使用 created_at/ID 为旧名单猜顺序。设计切片名 C1、R1
  与 review_level 的 R1（Deliverable Integrity Review 级别）不是同一概念，不得混用。
  Reality（本接受不改变现状）：设计被接受不等于已实现、已配置或已验收——C1 与名单追加
  切片都还没有实现提交，产品远端 develop 仍为 83ba4a508d97f00f5cfdc326c88fc5c78481299b，
  生产 EntryAbility 仍未接入实验库，S1 生产策略对缺批准输入仍 fail-closed；设计随附的 35 项
  业务矩阵、平台 relationalStore V01–V10、A03 真实跨进程重启、A08 真实硬件竞争、名单 UI、
  生产组装、设备、签名发布与 R2 全部 NOT_RUN。设计/审查报告中的成熟度百分比（如 C1 100%、
  R1 95%）属设计者与审查者评价，不是实现或测试事实，本条不采用为验证证据；其源码检索与
  38 项仓库测试属 05 报告，由该报告承担，本条不重做也不升级为平台结论。
  保留的停止边界（Q1–Q6 由本设计明确提出，均不因本接受解除；各只阻断所列具体分支，由 01
  准备完整决策材料，不把局部缺口扩大成全业务阻塞）：Q1 相同观察时间出现相反方向时谁先谁后
  仍未裁决——设计对混向同时间返回 UNAVAILABLE/OBSERVATION_ORDER_UNRESOLVED，这是防猜测的
  技术保护，不是已批准排序算法，也不得据 ID 字典序伪造成教师观察顺序；Q2 opened_at 语义与
  历史归属判定规则未定，L1 生产时间路由等待，不得回写旧行或据单条比较宣称历史归属已判；
  Q3 Undo/纠错（G03）未启用，纠错生产入口保持关闭，不得用正向记录抵消错误；Q4 FollowUp
  再出现节奏、教师调整合并与补记草稿跨进程/切班恢复未定，未完成前不得交付声称支持完整补记
  的生产 UI，也不得用假 Evidence 持久化草稿；Q5 同班同名区分 UI 与旧名单迁移方式未定（R1
  数据层追加不需要这些选择）；Q6 L1 专用 DDL/回执编码与真机设备授权未准入，04 不得从本设计
  推断未给出的 DDL，设备包 OFF 只令相应平台验收 NOT_RUN。
  未被本接受改变：上文除 G01/G02/G06 之外的产品取舍（按不同作业计数、有限自动关闭、拖动
  排序、同班同名区分、旧名单迁移等）继续 pending；main 合并、公开上传、真实数据、旧库迁移
  执行、设备、签名与发布边界完全不变。与既有对象的关系：本条不取代 FACT-TAPP1-000003 或
  FACT-TAPP1-000004，本批未改写这两条正文；D01/D02 历史附件及其历史 APPROVE 未被编辑，本
