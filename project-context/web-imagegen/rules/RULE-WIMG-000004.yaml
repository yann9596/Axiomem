schema_version: "1.1"
kind: rule
id: RULE-WIMG-000004
legacy_ids: []

title: Provider exclusivity (explicit global switch)
statement: >
  Web ImageGen uses an explicit global Generation Provider switch, never
  prompt-routed or fallback backends. Provider values are default | grok | gpt;
  the official OpenAI ImageGen Skill and the Web ImageGen Skill are globally
  mutually exclusive; a user-invoked switch enables exactly one path and then
  requires a Codex restart. Each job freezes its provider for its lifetime.
  Future provider integrations may add explicit switch values but must preserve
  mutual exclusion, supplier-specific boundaries, and visible failures. New
  providers must not be enabled simultaneously, guessed from prompts, or
  silently switched after failure. Browser provider integrations route through
  one installed Web ImageGen Skill (no per-provider globally discoverable
  skills).

