schema_version: "1.1"
kind: rule
id: RULE-WIMG-000005
legacy_ids: []

title: Browser boundary (Codex Chrome only; no credential access)
statement: >
  Browser provider interaction (grok / gpt) is owned by Codex's Chrome capability
  and is limited to the user-supplied, already-logged-in tab explicitly handed to
  Codex (@Chrome / tab mention). The workflow never searches for, opens, or
  replaces tabs, and never reads or writes cookies, browser storage, passwords,
  or profiles, nor replays raw provider HTTP requests. Authenticated image bytes
  may be materialized only from the verified current post through Chrome's media
  or page-asset surfaces, then passed to the local validator (an existing
  download may be reused only when its provider filename uniquely contains the
  exact frozen post identity and its bytes pass the same hard validation). No
  MCP server, HTTP daemon, self-managed Chromium, independent profile, CDP
  connection, second browser backend, compatibility layer, or fallback to
  another provider. Provider failures remain visible.

scope:
  type: project
  project_id: web-imagegen
  projects: []
  task_id: null

