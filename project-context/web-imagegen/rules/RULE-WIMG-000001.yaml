schema_version: "1.1"
kind: rule
id: RULE-WIMG-000001
legacy_ids: []

title: Product repo integrity and worktree isolation
statement: >
  Never clean, overwrite, commit or discard the product repo's current uncommitted
  and untracked content. Product tasks run in an independent worktree; the main
  working tree is never used as the execution workspace.

