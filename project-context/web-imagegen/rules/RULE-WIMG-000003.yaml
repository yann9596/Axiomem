schema_version: "1.1"
kind: rule
id: RULE-WIMG-000003
legacy_ids: []

title: Memory system construction boundaries
statement: >
  Do not build Neo4j, full-chat vectorization, or fully automatic merge. RAG V1
  uses SQLite FTS plus metadata and limited relations; embedding stays
  interface-only (disabled until a model is selected) and must never be claimed
  as active. The derived index is never canonical and is never git-tracked.

