kind: rule
id: RULE-WIMG-000002
legacy_ids: []

title: Write ownership boundaries
statement: >
  Product code writes are owned solely by the Software Engineer. Canonical memory
  writes are owned solely by the Context Engineer. QA must not modify the
  implementation and then self-PASS. Final merge is reserved for a human.
  Platform permissions are not hard isolation; non-implementation-role write
  restrictions are enforced by instructions, with real hard boundaries (separate
  Git credentials, branch protection, ACLs, MCP/runtime tool isolation) to be
  added separately.

