metadata_field_migration:
  importance: dropped (legacy_metadata.importance kept in this file only for audit; no retrieval use)
  confidence: dropped; verification enum carries meaning (numeric 0.85/0.9/0.6 never upgraded to pseudo-verified)
  freshness_stale_archived: no data existed; no migration burden; new lifecycle policy in team-context/policies/lifecycle.yaml
  status: canonical→active per target type; candidate→finding open/processed+disposition
  scope: coarse enum → four-type struct with deterministic validation; tags → domains[] extraction; legacy tags kept only in legacy files
  sources: → source_refs / verified_against with claim_relation
  verified_at_by: → verification + verified_at (verification value recomputed during migration revalidation, not copied)
  relationships: related_to mostly dropped (chain/assembly semantics moved to roles/checkpoints); depends_on kept only where stable semantic (RULE dependencies recorded via refs); conflicts_with/supersedes enter the new relation model (fact.relations.supersedes, drift_of)
