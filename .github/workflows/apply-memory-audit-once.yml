name: Apply exact audit source once
on:
  push:
    branches: [fix/memory-lifecycle-audit-20260928]
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  apply-exact-source:
    if: github.repository == 'yann9596/Axiomem' && github.ref == 'refs/heads/fix/memory-lifecycle-audit-20260928'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
          persist-credentials: true
      - name: Verify exact baseline and apply fingerprinted source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,hashlib,json,lzma,os,pathlib,subprocess,urllib.request
          BASE='c2bdbfeef052b85ec51b3f40b04d8166c22dcc7e'
          PARENT='6a21544c1c35724ef336fcffa95b2abc71391e3e'
          BRANCH='fix/memory-lifecycle-audit-20260928'
          TEMP='.github/workflows/apply-memory-audit-once.yml'
          def git(*args):
              return subprocess.check_output(['git',*args],text=True).strip()
          assert os.environ['GITHUB_REPOSITORY']=='yann9596/Axiomem'
          assert os.environ['GITHUB_REF']=='refs/heads/'+BRANCH
          assert git('rev-parse','HEAD')==os.environ['GITHUB_SHA']
          assert git('rev-parse','HEAD^')==PARENT, 'branch moved; no automatic rebase'
          assert git('rev-parse','HEAD^^')==BASE
          assert git('diff','--name-only',BASE,'HEAD')==TEMP
          assert not git('status','--porcelain'), 'dirty checkout'
          shas=['87f90854cb6fce7a6f93de636933c7cb78009c94','f9b31e6b990f6726c89b915b6bf52a74d7da6143','0b87cf97d00c5cfba902f21d1795c12f7b7e9aee','f126fd80b587b0a1521394dd08e134c7e7359783','af4cf2139dfcd109bb5d92bffac9637360d8a784','204fd2b3477112523a418e3bb378298a77add956','2738a914a378cb62a4c4b43f4d496015c904da87','8080f62e407269840241f361a84a258c569fb40d']
          chunks=[]
          for sha in shas:
              url='https://api.github.com/repos/yann9596/Axiomem/git/blobs/'+sha
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req,timeout=30) as response:
                  obj=json.load(response)
              assert obj['encoding']=='base64'
              chunk=base64.b64decode(obj['content'])
              assert hashlib.sha1(b'blob '+str(len(chunk)).encode()+b'\0'+chunk).hexdigest()==sha
              chunks.append(chunk)
          compressed=base64.b64decode(b''.join(chunks),validate=True)
          assert hashlib.sha256(compressed).hexdigest()=='c863e288fa8791a180870b3bae8c7b12d753717e4792dd710b5aa2256b0a8c80'
          raw=lzma.decompress(compressed)
          assert hashlib.sha256(raw).hexdigest()=='a1a06508d0b68a8a7a30bc4a914f4bbff87d837cb7fe807fd43bdab981dfc970'
          payload=json.loads(raw)
          assert payload['format']=='axiomem-exact-edits/1'
          assert payload['baseline_commit']==BASE and payload['branch']==BRANCH
          assert len(payload['files'])==38
          allowed_prefixes=('docs/repairs/2026-09-28/','project-context/teachers-app1/','tools/')
          allowed_exact={'README.md','team-context/policies/context-quality.json','skills/multica-context-handoff/scripts/handoff_pipeline.py'}
          staged=[]
          for item in payload['files']:
              name=item['path']
              p=pathlib.PurePosixPath(name)
              assert not p.is_absolute() and '..' not in p.parts and str(p)==name
              assert name in allowed_exact or name.startswith(allowed_prefixes)
              assert name not in staged
              path=pathlib.Path(name)
              assert not path.is_symlink() and not any(x.is_symlink() for x in path.parents)
              before=item['before_sha256']
              if before is None:
                  assert not path.exists(), name
                  assert 'content' in item and 'edits' not in item
                  data=item['content'].encode('utf-8')
              else:
                  old=path.read_bytes()
                  assert hashlib.sha256(old).hexdigest()==before, name
                  lines=old.decode('utf-8').splitlines(keepends=True)
                  edits=item['edits']
                  previous=0
                  for edit in edits:
                      a,b=edit['start'],edit['end']
                      assert type(a) is int and type(b) is int and previous<=a<=b<=len(lines)
                      previous=b
                  for edit in reversed(edits):
                      lines[edit['start']:edit['end']]=[edit['text']]
                  data=''.join(lines).encode('utf-8')
              assert hashlib.sha256(data).hexdigest()==item['after_sha256'], name
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(data)
              staged.append(name)
          subprocess.run(['git','add','--',*staged],check=True)
          assert sorted(git('diff','--cached','--name-only').splitlines())==sorted(staged)
          for item in payload['files']:
              committed=subprocess.check_output(['git','show',':'+item['path']])
              assert hashlib.sha256(committed).hexdigest()==item['after_sha256'],item['path']
          subprocess.run(['git','-c','core.whitespace=blank-at-eol,blank-at-eof,space-before-tab,cr-at-eol','diff','--cached','--check'],check=True)
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'audit-application'
          out.mkdir(parents=True,exist_ok=True)
          (out/'application.json').write_text(json.dumps({'baseline':BASE,'application_parent':os.environ['GITHUB_SHA'],'payload_sha256':hashlib.sha256(raw).hexdigest(),'files':[{'path':i['path'],'sha256':i['after_sha256']} for i in payload['files']],'project_pause':'PRESERVED','production_deployment':'NOT_RUN'},indent=2))
          PY
      - name: Verify syntax and all new offline regressions
        run: |
          set -euo pipefail
          python -m compileall -q tools skills
          python -m unittest discover -s tools/tests -p test_index_lifecycle_audit.py -v 2>&1 | tee "$RUNNER_TEMP/audit-application/index-tests.log"
          python -m unittest discover -s tools/tests -p test_memory_audit_repair.py -v 2>&1 | tee "$RUNNER_TEMP/audit-application/repair-tests.log"
          git diff --exit-code
      - name: Commit source to repair branch without force
        run: |
          set -euo pipefail
          git fetch origin refs/heads/fix/memory-lifecycle-audit-20260928
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: curate current memory and enforce bounded lifecycle quality' -m 'Apply 38 SHA-256 verified source files. Preserve superseded history, authority boundaries, project pause, full-read discovery and global freshness. New offline regressions pass; independent review, Windows deployment and live acceptance remain required.'
          git push origin HEAD:refs/heads/fix/memory-lifecycle-audit-20260928
          git rev-parse HEAD > "$RUNNER_TEMP/audit-application/source-sha.txt"
          git archive --format=zip --output="$RUNNER_TEMP/audit-application/repository-source.zip" HEAD
      - name: Export application receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: audit-source-application-${{ github.run_id }}
          path: ${{ runner.temp }}/audit-application
          retention-days: 3
          if-no-files-found: warn
